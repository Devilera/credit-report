<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreditBuddy | Validation Report</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-slate-200 p-6 ${className}`}>{children}</div>
        );

        function App() {
            const [activeTab, setActiveTab] = useState('overview');

            return (
                <div className="min-h-screen font-sans text-slate-800">
                    <header className="bg-white border-b border-slate-200 p-4 sticky top-0 z-10">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-blue-600 p-2 rounded-lg text-white"><Icon name="trending-up" /></div>
                                <div>
                                    <h1 className="text-xl font-bold">CreditBuddy</h1>
                                    <p className="text-xs text-slate-500 uppercase font-semibold">Validation Report</p>
                                </div>
                            </div>
                            <div className="text-right hidden sm:block">
                                <p className="text-sm font-medium">Debasish Mallick</p>
                                <p className="text-xs text-slate-400">Founder & CEO</p>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 py-8 space-y-8">
                        <section className="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-8 text-white shadow-lg flex flex-col md:flex-row justify-between items-center gap-6">
                            <div className="max-w-2xl">
                                <h2 className="text-2xl font-bold mb-2">Executive Summary</h2>
                                <p className="text-blue-100">Validation confirms critical market demand. Ground research across 1,000+ students reveals a clear need for an ethical, student-first ecosystem.</p>
                            </div>
                            <div className="bg-white/10 backdrop-blur-md rounded-xl p-6 border border-white/20 text-center min-w-[200px]">
                                <p className="text-blue-100 text-sm uppercase mb-1">Avg. Monthly Shortfall</p>
                                <div className="text-4xl font-bold">₹7,500</div>
                            </div>
                        </section>

                        <div className="flex border-b border-slate-200 gap-6">
                            {['overview', 'demographics', 'feedback', 'market'].map((tab) => (
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`pb-3 text-sm font-medium capitalize ${activeTab === tab ? 'text-blue-600 border-b-2 border-blue-600' : 'text-slate-500'}`}>{tab}</button>
                            ))}
                        </div>

                        {activeTab === 'overview' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                <Card className="text-center"><h3 className="text-3xl font-bold">75%</h3><p className="text-sm text-slate-500">Financial Challenges</p></Card>
                                <Card className="text-center"><h3 className="text-3xl font-bold">78%</h3><p className="text-sm text-slate-500">Interest in "Earn & Learn"</p></Card>
                                <Card className="text-center"><h3 className="text-3xl font-bold">62%</h3><p className="text-sm text-slate-500">Prefer RBI-Compliant</p></Card>
                                <Card className="text-center"><h3 className="text-3xl font-bold">40%</h3><p className="text-sm text-slate-500">Used Lending Apps</p></Card>
                            </div>
                        )}

                        {activeTab === 'demographics' && (
                            <Card className="text-center">
                                <h3 className="font-bold text-lg mb-4">Research Methodology</h3>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div><div className="text-2xl font-bold text-blue-600">1,000+</div><div className="text-xs">Students</div></div>
                                    <div><div className="text-2xl font-bold text-blue-600">10+</div><div className="text-xs">Campuses</div></div>
                                    <div><div className="text-2xl font-bold text-blue-600">18-24</div><div className="text-xs">Age Group</div></div>
                                    <div><div className="text-2xl font-bold text-blue-600">Pan-India</div><div className="text-xs">Region</div></div>
                                </div>
                            </Card>
                        )}

                        {activeTab === 'feedback' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <Card className="bg-slate-800 text-white italic"><p>"Finally, a platform that understands students."</p></Card>
                                <Card className="italic text-slate-700"><p>"Transparency will make this sustainable."</p></Card>
                                <Card className="italic text-slate-700"><p>"Concept is great. Focus on being student-friendly."</p></Card>
                            </div>
                        )}

                        {activeTab === 'market' && (
                            <Card>
                                <h3 className="font-bold text-lg mb-4 text-center">Market Potential</h3>
                                <div className="space-y-4">
                                    <div><p className="text-sm font-medium">TAM: 43M+ Students</p><div className="w-full bg-blue-900 h-4 rounded-full"></div></div>
                                    <div><p className="text-sm font-medium">Urban Focus: 25M Students</p><div className="w-full bg-blue-600 h-4 rounded-full w-[58%]"></div></div>
                                </div>
                            </Card>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
</body>
</html>
