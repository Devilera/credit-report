<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreditBuddy | Validation Report</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Lucide Icon Wrapper ---
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        // --- Reusable UI Components ---
        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden ${className}`}>
                {children}
            </div>
        );

        const Badge = ({ children, color = "blue" }) => {
            const colors = {
                blue: "bg-blue-100 text-blue-700",
                green: "bg-emerald-100 text-emerald-700",
                amber: "bg-amber-100 text-amber-700",
                red: "bg-rose-100 text-rose-700",
            };
            return (
                <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${colors[color] || colors.blue}`}>
                    {children}
                </span>
            );
        };

        const CircularProgress = ({ value, label, subLabel, color = "#3b82f6" }) => {
            const radius = 35;
            const circumference = 2 * Math.PI * radius;
            const strokeDashoffset = circumference - (value / 100) * circumference;

            return (
                <div className="flex flex-col items-center justify-center p-4">
                    <div className="relative w-32 h-32 flex items-center justify-center">
                        <svg className="w-full h-full transform -rotate-90">
                            <circle cx="64" cy="64" r={radius} stroke="#e2e8f0" strokeWidth="8" fill="transparent" />
                            <circle cx="64" cy="64" r={radius} stroke={color} strokeWidth="8" fill="transparent"
                                strokeDasharray={circumference}
                                strokeDashoffset={strokeDashoffset}
                                strokeLinecap="round"
                                className="transition-all duration-1000 ease-out"
                            />
                        </svg>
                        <span className="absolute text-2xl font-bold text-slate-700">{value}%</span>
                    </div>
                    <h4 className="mt-2 font-semibold text-slate-800 text-center">{label}</h4>
                    <p className="text-xs text-slate-500 text-center">{subLabel}</p>
                </div>
            );
        };

        const SimpleBarChart = ({ data, maxVal }) => (
            <div className="w-full space-y-3">
                {data.map((item, idx) => (
                    <div key={idx} className="w-full">
                        <div className="flex justify-between text-sm mb-1">
                            <span className="font-medium text-slate-700">{item.label}</span>
                            <span className="font-bold text-slate-900">{item.value}%</span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-3">
                            <div className={`h-3 rounded-full ${item.color || 'bg-blue-500'}`} style={{ width: `${(item.value / maxVal) * 100}%` }}></div>
                        </div>
                    </div>
                ))}
            </div>
        );

        // --- Main App Component ---
        function App() {
            const [activeTab, setActiveTab] = useState('overview');

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-10">
                        <div className="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-blue-600 p-2 rounded-lg text-white">
                                    <Icon name="trending-up" size={24} />
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold text-slate-900 leading-tight">CreditBuddy</h1>
                                    <p className="text-xs text-slate-500 uppercase tracking-wide font-semibold">Validation Report</p>
                                </div>
                            </div>
                            <div className="text-right hidden sm:block">
                                <p className="text-sm font-medium text-slate-900">Debasish Mallick</p>
                                <p className="text-xs text-slate-400">Founder & CEO</p>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 py-8 space-y-8">
                        <section className="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-6 sm:p-10 text-white shadow-lg">
                            <div className="flex flex-col md:flex-row gap-6 items-start justify-between">
                                <div className="space-y-4 max-w-2xl">
                                    <h2 className="text-2xl font-bold">Executive Summary</h2>
                                    <p className="text-blue-100 leading-relaxed text-lg">
                                        Validation confirms critical market demand. Ground research across <span className="font-bold text-white">1,000+ students</span> reveals a clear need for an ethical, student-first ecosystem combining microloans, income enablement, and financial literacy.
                                    </p>
                                    <div className="flex flex-wrap gap-3">
                                        <div className="bg-white/20 backdrop-blur-sm px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2">
                                            <Icon name="shield-check" size={16} /> RBI Compliant
                                        </div>
                                        <div className="bg-white/20 backdrop-blur-sm px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2">
                                            <Icon name="target" size={16} /> Student First
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-white/10 backdrop-blur-md rounded-xl p-6 border border-white/20 min-w-[200px]">
                                    <div className="text-center">
                                        <p className="text-blue-100 text-sm font-medium uppercase mb-1">Avg. Monthly Shortfall</p>
                                        <div className="text-4xl font-bold text-white mb-1">₹7,500</div>
                                        <div className="text-xs text-blue-200">Range: ₹5k - ₹10k</div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <div className="flex overflow-x-auto pb-2 border-b border-slate-200 gap-6">
                            {['overview', 'demographics', 'feedback', 'market'].map((tab) => (
                                <button key={tab} onClick={() => setActiveTab(tab)}
                                    className={`pb-3 text-sm font-bold capitalize whitespace-nowrap transition-colors ${activeTab === tab ? 'text-blue-600 border-b-2 border-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                                    {tab}
                                </button>
                            ))}
                        </div>

                        {activeTab === 'overview' && (
                            <div className="space-y-6 animate-in">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <Card className="p-5 flex flex-col items-center text-center">
                                        <div className="p-3 bg-rose-50 rounded-full mb-3"><Icon name="alert-triangle" className="text-rose-500" /></div>
                                        <h3 className="text-3xl font-bold">75%</h3>
                                        <p className="text-sm text-slate-500 mt-1">Face regular financial challenges</p>
                                    </Card>
                                    <Card className="p-5 flex flex-col items-center text-center">
                                        <div className="p-3 bg-emerald-50 rounded-full mb-3"><Icon name="trending-up" className="text-emerald-500" /></div>
                                        <h3 className="text-3xl font-bold">78%</h3>
                                        <p className="text-sm text-slate-500 mt-1">Interest in "Earn & Learn"</p>
                                    </Card>
                                    <Card className="p-5 flex flex-col items-center text-center">
                                        <div className="p-3 bg-blue-50 rounded-full mb-3"><Icon name="shield-check" className="text-blue-500" /></div>
                                        <h3 className="text-3xl font-bold">62%</h3>
                                        <p className="text-sm text-slate-500 mt-1">Prefer RBI-Compliant</p>
                                    </Card>
                                    <Card className="p-5 flex flex-col items-center text-center">
                                        <div className="p-3 bg-amber-50 rounded-full mb-3"><Icon name="activity" className="text-amber-500" /></div>
                                        <h3 className="text-3xl font-bold">40%</h3>
                                        <p className="text-sm text-slate-500 mt-1">Have used lending apps</p>
                                    </Card>
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    <Card className="p-6">
                                        <h3 className="font-bold text-lg mb-6 flex items-center gap-2"><Icon name="bar-chart-3" className="text-blue-500" size={20} /> Financial Distress</h3>
                                        <div className="flex flex-wrap justify-around">
                                            <CircularProgress value={73} label="Recent Issues" subLabel="Last few months" color="#f43f5e" />
                                            <CircularProgress value={75} label="Regular Challenges" subLabel="Affects academics" color="#f59e0b" />
                                        </div>
                                    </Card>
                                    <Card className="p-6">
                                        <h3 className="font-bold text-lg mb-6 flex items-center gap-2"><Icon name="pie-chart" className="text-emerald-500" size={20} /> Feature Interest</h3>
                                        <SimpleBarChart maxVal={100} data={[
                                            { label: "Earn & Learn Interest", value: 78, color: 'bg-emerald-500' },
                                            { label: "RBI Compliance Preference", value: 62, color: 'bg-blue-600' },
                                            { label: "Current App Users", value: 40, color: 'bg-slate-400' },
                                        ]} />
                                    </Card>
                                </div>
                            </div>
                        )}

                        {activeTab === 'demographics' && (
                            <div className="space-y-6 animate-in">
                                <Card>
                                    <div className="bg-slate-50 px-6 py-4 border-b border-slate-200"><h3 className="font-bold">Research Methodology</h3></div>
                                    <div className="grid grid-cols-2 lg:grid-cols-4 p-6 divide-x divide-slate-100">
                                        <div className="text-center px-4">
                                            <div className="text-3xl font-bold text-blue-600">1,000+</div>
                                            <div className="text-xs text-slate-500 font-medium uppercase mt-1">Students</div>
                                        </div>
                                        <div className="text-center px-4">
                                            <div className="text-3xl font-bold text-blue-600">10+</div>
                                            <div className="text-xs text-slate-500 font-medium uppercase mt-1">Campuses</div>
                                        </div>
                                        <div className="text-center px-4">
                                            <div className="text-3xl font-bold text-blue-600">18-24</div>
                                            <div className="text-xs text-slate-500 font-medium uppercase mt-1">Age Group</div>
                                        </div>
                                        <div className="text-center px-4">
                                            <div className="text-3xl font-bold text-blue-600">Odisha</div>
                                            <div className="text-xs text-slate-500 font-medium uppercase mt-1">Focus Region</div>
                                        </div>
                                    </div>
                                </Card>
                            </div>
                        )}

                        {activeTab === 'feedback' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 animate-in">
                                <Card className="p-6 bg-slate-800 text-white relative">
                                    <Icon name="quote" className="text-slate-600 absolute top-4 right-4 opacity-30" size={40} />
                                    <p className="italic text-slate-200 mb-6 text-lg relative z-10">"Finally, a platform that understands students and prioritizes trust over profit."</p>
                                    <div className="mt-auto pt-4 border-t border-slate-700">
                                        <p className="font-bold text-sm">Student Participant</p>
                                        <p className="text-xs text-slate-400">Campus Interview</p>
                                    </div>
                                </Card>
                                <Card className="p-6 relative text-slate-700">
                                    <Icon name="quote" className="text-slate-100 absolute top-4 right-4" size={40} />
                                    <p className="italic mb-6 text-lg relative z-10">"Transparency and ethical lending will make this sustainable. Communicate how data is protected."</p>
                                    <div className="mt-auto pt-4 border-t border-slate-100">
                                        <p className="font-bold text-sm">Bhupesh Sahoo</p>
                                        <p className="text-xs text-slate-400">BITS Pilani</p>
                                    </div>
                                </Card>
                                <Card className="p-6 relative text-slate-700">
                                    <Icon name="quote" className="text-slate-100 absolute top-4 right-4" size={40} />
                                    <p className="italic mb-6 text-lg relative z-10">"UI design can be improved, but the concept is great. Focus on making it student-friendly."</p>
                                    <div className="mt-auto pt-4 border-t border-slate-100">
                                        <p className="font-bold text-sm text-slate-900">Bimal Kumar</p>
                                        <p className="text-xs text-slate-400">SCB Medical College</p>
                                    </div>
                                </Card>
                            </div>
                        )}

                        {activeTab === 'market' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 animate-in">
                                <Card className="p-6">
                                    <h3 className="font-bold text-lg text-slate-800 mb-6">Market Potential</h3>
                                    <SimpleBarChart maxVal={100} data={[
                                        { label: "TAM (Total Students)", value: 100, color: 'bg-blue-900' },
                                        { label: "Serviceable Market", value: 58, color: 'bg-blue-600' }
                                    ]} />
                                    <div className="grid grid-cols-2 gap-4 mt-8">
                                        <div className="bg-slate-50 p-4 rounded-lg">
                                            <div className="text-2xl font-bold text-slate-800">9.8%</div>
                                            <div className="text-xs text-slate-500 uppercase font-semibold">CAGR</div>
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded-lg">
                                            <div className="text-2xl font-bold text-slate-800">2X</div>
                                            <div className="text-xs text-slate-500 uppercase font-semibold">Growth</div>
                                        </div>
                                    </div>
                                </Card>
                                <Card className="p-6">
                                    <h3 className="font-bold text-lg text-slate-800 mb-6">Strategic Roadmap</h3>
                                    <div className="space-y-6 relative border-l-2 border-slate-100 ml-3 pl-6">
                                        <div className="relative">
                                            <div className="absolute -left-[33px] bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold">1</div>
                                            <h4 className="font-bold text-sm">Product Development</h4>
                                            <p className="text-xs text-slate-500 mt-1">MVP & RBI Compliance</p>
                                        </div>
                                        <div className="relative">
                                            <div className="absolute -left-[33px] bg-slate-200 text-slate-600 w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold">2</div>
                                            <h4 className="font-bold text-sm">Campus Pilot</h4>
                                            <p className="text-xs text-slate-500 mt-1">Odisha-based campus launch</p>
                                        </div>
                                        <div className="relative">
                                            <div className="absolute -left-[33px] bg-slate-200 text-slate-600 w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold">3</div>
                                            <h4 className="font-bold text-sm">Pan-India Scale</h4>
                                            <p className="text-xs text-slate-500 mt-1">Regional expansion</p>
                                        </div>
                                    </div>
                                </Card>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
