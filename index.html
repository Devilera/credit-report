<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreditBuddy | Validation Report</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-slate-200 p-6 ${className}`}>{children}</div>
        );

        function App() {
            const [activeTab, setActiveTab] = useState('overview');

            return (
                <div className="min-h-screen font-sans text-slate-800">
                    <header className="bg-white border-b border-slate-200 p-4 sticky top-0 z-10">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-blue-600 p-2 rounded-lg text-white font-bold text-xl">↗</div>
                                <div>
                                    <h1 className="text-xl font-bold">CreditBuddy</h1>
                                    <p className="text-xs text-slate-500 uppercase font-semibold">Validation Report</p>
                                </div>
                            </div>
                            <div className="text-right">
                                <p className="text-sm font-medium">Debasish Mallick</p>
                                <p className="text-xs text-slate-400">Founder & CEO</p>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 py-8 space-y-8">
                        <section className="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-8 text-white shadow-lg flex flex-col md:flex-row justify-between items-center gap-6">
                            <div className="max-w-2xl">
                                <h2 className="text-2xl font-bold mb-2">Executive Summary</h2>
                                <p className="text-blue-100 italic">"Validation confirms critical market demand. Ground research across 1,000+ students reveals a clear need for an ethical, student-first ecosystem."</p>
                            </div>
                            <div className="bg-white/10 backdrop-blur-md rounded-xl p-6 border border-white/20 text-center min-w-[200px]">
                                <p className="text-blue-100 text-sm uppercase mb-1">Avg. Monthly Shortfall</p>
                                <div className="text-4xl font-bold">₹7,500</div>
                            </div>
                        </section>

                        <div className="flex border-b border-slate-200 gap-6 overflow-x-auto">
                            {['overview', 'demographics', 'feedback', 'market'].map((tab) => (
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`pb-3 text-sm font-bold capitalize whitespace-nowrap ${activeTab === tab ? 'text-blue-600 border-b-4 border-blue-600' : 'text-slate-500'}`}>{tab}</button>
                            ))}
                        </div>

                        {/* OVERVIEW CONTENT */}
                        {activeTab === 'overview' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 animate-in fade-in duration-300">
                                <Card className="text-center border-t-4 border-t-rose-500"><h3 className="text-3xl font-bold">75%</h3><p className="text-sm text-slate-500">Financial Challenges</p></Card>
                                <Card className="text-center border-t-4 border-t-emerald-500"><h3 className="text-3xl font-bold">78%</h3><p className="text-sm text-slate-500">Interest in "Earn & Learn"</p></Card>
                                <Card className="text-center border-t-4 border-t-blue-500"><h3 className="text-3xl font-bold">62%</h3><p className="text-sm text-slate-500">Prefer RBI-Compliant</p></Card>
                                <Card className="text-center border-t-4 border-t-amber-500"><h3 className="text-3xl font-bold">40%</h3><p className="text-sm text-slate-500">Used Lending Apps</p></Card>
                            </div>
                        )}

                        {/* DEMOGRAPHICS CONTENT */}
                        {activeTab === 'demographics' && (
                            <div className="space-y-6 animate-in fade-in duration-300">
                                <Card className="text-center">
                                    <h3 className="font-bold text-lg mb-6 underline">Research Methodology</h3>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-8">
                                        <div><div className="text-3xl font-bold text-blue-600">1,000+</div><div className="text-sm font-medium text-slate-600">Students Surveyed</div></div>
                                        <div><div className="text-3xl font-bold text-blue-600">10+</div><div className="text-sm font-medium text-slate-600">Major Campuses</div></div>
                                        <div><div className="text-3xl font-bold text-blue-600">18-24</div><div className="text-sm font-medium text-slate-600">Age Group</div></div>
                                        <div><div className="text-3xl font-bold text-blue-600">Pan-India</div><div className="text-sm font-medium text-slate-600">Target Region</div></div>
                                    </div>
                                </Card>
                            </div>
                        )}

                        {/* FEEDBACK CONTENT */}
                        {activeTab === 'feedback' && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 animate-in fade-in duration-300">
                                <Card className="bg-slate-800 text-white italic border-l-4 border-l-blue-400">
                                    <p className="text-lg">"Finally, a platform that understands students and prioritizes trust over profit."</p>
                                    <p className="mt-4 text-xs text-slate-400 not-italic font-bold uppercase">— Student Interview</p>
                                </Card>
                                <Card className="italic text-slate-700 bg-blue-50">
                                    <p className="text-lg">"Transparency and ethical lending will make this sustainable. Focus on data protection."</p>
                                    <p className="mt-4 text-xs text-slate-500 not-italic font-bold uppercase">— BITS Pilani Feedback</p>
                                </Card>
                                <Card className="italic text-slate-700">
                                    <p className="text-lg">"UI design can be improved, but the concept is great. Focus on being student-friendly."</p>
                                    <p className="mt-4 text-xs text-slate-500 not-italic font-bold uppercase">— SCB Medical College</p>
                                </Card>
                            </div>
                        )}

                        {/* MARKET CONTENT */}
                        {activeTab === 'market' && (
                            <div className="animate-in fade-in duration-300">
                                <Card>
                                    <h3 className="font-bold text-lg mb-6 text-center">Market Opportunity</h3>
                                    <div className="space-y-8">
                                        <div>
                                            <div className="flex justify-between mb-2 font-bold"><span className="text-slate-700">Total Addressable Market (TAM)</span><span>43M+ Students</span></div>
                                            <div className="w-full bg-slate-100 h-6 rounded-full overflow-hidden"><div className="bg-blue-900 h-full w-full"></div></div>
                                        </div>
                                        <div>
                                            <div className="flex justify-between mb-2 font-bold"><span className="text-slate-700">Serviceable Market (Urban Focus)</span><span>25M Students</span></div>
                                            <div className="w-full bg-slate-100 h-6 rounded-full overflow-hidden"><div className="bg-blue-600 h-full w-[58%]"></div></div>
                                        </div>
                                    </div>
                                </Card>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
